<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JavaScript DOM Interaction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="main-heading">Welcome to My Page</h1>
  </header>

  <section>
    <p id="info-text">Click the buttons below to interact with this page using JavaScript!</p>
    <button onclick="changeText()">Change Text</button>
    <button onclick="changeStyle()">Change Style</button>
    <button onclick="toggleElement()">Add/Remove Element</button>
  </section>

  <div id="dynamic-area"></div>

  <footer>
    <p>&copy; 2025 MyWebsite</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
